name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: |
          python -m py_compile main.py log_store.py vad.py secure_store.py hotkey_manager.py hotkey_recorder.py gemini_live.py config.py audio_capture.py text_injector.py sound_effects.py test_verification.py ui/floating_hud.py ui/tray_icon.py ui/settings_dialog.py

      - name: Run verification suite
        run: python test_verification.py -v
